name: Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The ralf-utils revision used to verify the packages
  RALF_UTILS_REF: 6bf14f391de3954e035a21854ea404f6e70f3b03

jobs:
  integration-tests:
    runs-on: ${{ matrix.os }}
    name: Integration Tests (${{ matrix.os }})

    strategy:
      matrix:
        os: [ "ubuntu-latest", "macos-latest" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool cmake ninja-build \
            libarchive-dev libxml2-dev libssl-dev liblz4-dev libzstd-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool cmake ninja libarchive libxml2 openssl@3 lz4

      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs > rustup-init.sh
          sh rustup-init.sh -y --default-toolchain stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Fetch and build ralf-utils
        run: |
          git clone https://github.com/rdkcentral/ralf-utils.git "$RUNNER_TEMP/ralf-utils"
          git -C "$RUNNER_TEMP/ralf-utils" checkout "$RALF_UTILS_REF"
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA="-DLibArchive_ROOT=$(brew --prefix libarchive) -DLibXml2_ROOT=$(brew --prefix libxml2) -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"
          fi
          cmake -S "$RUNNER_TEMP/ralf-utils" -B "$RUNNER_TEMP/ralf-utils/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release $EXTRA
          cmake --build "$RUNNER_TEMP/ralf-utils/build" --target unwgt
          echo "RALF_UTILS_DIR=$RUNNER_TEMP/ralf-utils/build/tools/unwgt" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: |
          . "$HOME/.cargo/env"
          cargo test --test packages --verbose
